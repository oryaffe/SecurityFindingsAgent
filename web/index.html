<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vulnerability &amp; Exposure Support Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --concrete: #2c3140;
      --panel: #3a4052;
      --panel-deep: #252b38;
      --print: #ede6d9;
      --mute: #9a9488;
      --sodium: #e8a54b;
      --copper: #6ba3a7;
      --alert: #d46a6a;
      --ink: #1e2430;
      --rule: rgba(237, 230, 217, 0.12);
      --led-off: #5a3a3a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      display: flex;
      background: var(--concrete);
      color: var(--print);
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    .rail {
      width: 14px;
      flex-shrink: 0;
      background: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 8px;
    }

    .led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--led-off);
      box-shadow: none;
    }

    .led.on {
      background: var(--copper);
      box-shadow: 0 0 8px var(--copper);
    }

    .led.busy {
      background: var(--sodium);
      box-shadow: 0 0 8px var(--sodium);
    }

    .led.off {
      background: var(--alert);
      box-shadow: 0 0 6px var(--alert);
    }

    .shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      max-width: 880px;
      margin: 0 auto;
      min-height: 100%;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px 16px;
      border-bottom: 1px solid var(--rule);
    }

    h1 {
      margin: 0;
      font-family: "IBM Plex Serif", serif;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.25;
    }

    .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--alert);
    }

    body.is-connected .status-dot { background: var(--copper); }
    body.is-busy .status-dot { background: var(--sodium); }

    #session-email {
      color: var(--mute);
    }

    button {
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid var(--rule);
      background: var(--panel);
      color: var(--print);
      padding: 8px 14px;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      border-color: var(--sodium);
      color: var(--sodium);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--sodium);
      outline-offset: 2px;
    }

    #auth-panel,
    #chat-panel {
      display: none;
    }

    body.show-auth #auth-panel { display: block; }
    body.show-chat #chat-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #auth-panel {
      padding: 48px 24px;
      max-width: 460px;
    }

    .auth-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mute);
      margin-bottom: 10px;
    }

    #auth-panel .auth-label + .auth-row + .auth-label {
      margin-top: 16px;
    }

    .auth-row {
      display: flex;
      gap: 8px;
    }

    #email-input,
    #password-input {
      flex: 1;
      background: var(--panel-deep);
      border: 1px solid var(--rule);
      color: var(--print);
      padding: 10px 12px;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 15px;
    }

    #auth-result {
      min-height: 1.4em;
      margin-top: 12px;
      font-size: 14px;
      color: var(--alert);
    }

    #auth-result.ok { color: var(--copper); }

    #conversation {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bubble {
      max-width: 92%;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--panel);
      border-left: 3px solid var(--sodium);
    }

    .bubble.agent {
      align-self: flex-start;
      background: var(--panel-deep);
      border-left: 3px solid var(--copper);
    }

    .who {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mute);
      margin-bottom: 6px;
    }

    .trace {
      align-self: stretch;
      background: #2a241c;
      border: 1px dashed rgba(232, 165, 75, 0.35);
      padding: 10px 12px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      color: #e0c48a;
      display: none;
    }

    body.thinking-on .trace { display: block; }

    .trace-title {
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sodium);
      margin-bottom: 8px;
      font-size: 10px;
    }

    .trace-line { margin: 3px 0; }

    .trace-kind { color: var(--sodium); min-width: 9ch; display: inline-block; }

    #composer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-end;
      padding: 12px 24px 10px;
      border-top: 1px solid var(--rule);
      background: var(--panel-deep);
    }

    #prompt-input {
      flex: 1 1 280px;
      min-height: 44px;
      max-height: 140px;
      resize: vertical;
      background: var(--ink);
      border: 1px solid var(--rule);
      color: var(--print);
      padding: 10px 12px;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 15px;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
      user-select: none;
    }

    .toggle input { accent-color: var(--sodium); }

    #app-status {
      padding: 0 24px 16px;
      min-height: 1.3em;
      font-size: 13px;
      color: var(--mute);
    }

    #app-status.error { color: var(--alert); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; }
      .meta { align-items: flex-start; }
      h1 { font-size: 1.15rem; }
    }
  </style>
</head>
<body class="show-auth">
  <aside class="rail" aria-hidden="true">
    <div id="led" class="led off"></div>
  </aside>
  <div class="shell">
    <header>
      <h1>Vulnerability &amp; Exposure Support Agent</h1>
      <div class="meta">
        <div id="conn-status" class="status">
          <span class="status-dot"></span>
          <span id="conn-label">Disconnected</span>
        </div>
        <div id="session-email"></div>
        <button id="disconnect-btn" type="button" hidden>Disconnect</button>
      </div>
    </header>

    <section id="auth-panel">
      <div class="auth-label">Organizational email</div>
      <div class="auth-row">
        <input id="email-input" type="email" autocomplete="username" placeholder="name@organization.com">
      </div>
      <div class="auth-label">Password</div>
      <div class="auth-row">
        <input id="password-input" type="password" autocomplete="current-password">
        <button id="auth-btn" type="button">Authenticate</button>
      </div>
      <div id="auth-result" role="status"></div>
    </section>

    <section id="chat-panel">
      <div id="conversation" aria-live="polite"></div>
      <form id="composer">
        <textarea id="prompt-input" rows="2" placeholder="Ask about findings, assets, SLAs, or remediation."></textarea>
        <button id="send-btn" type="submit">Send</button>
        <label class="toggle">
          <input id="thinking-toggle" type="checkbox">
          Show thinking
        </label>
      </form>
    </section>

    <div id="app-status" role="status"></div>
  </div>

  <script>
    const TOKEN_KEY = "access_token";
    const RECONNECT_MAX_ATTEMPTS = 5;
    const RECONNECT_BASE_MS = 1000;
    const RECONNECT_MAX_MS = 15000;
    const state = {
      ws: null,
      authenticated: false,
      busy: false,
      connected: false,
      showThinking: false,
      email: "",
      currentTrace: null,
      intentionalClose: false,
      reconnectMs: RECONNECT_BASE_MS,
      reconnectAttempts: 0,
      reconnectTimer: null,
      connState: "disconnected",
    };

    const led = document.getElementById("led");
    const connLabel = document.getElementById("conn-label");
    const sessionEmail = document.getElementById("session-email");
    const disconnectBtn = document.getElementById("disconnect-btn");
    const emailInput = document.getElementById("email-input");
    const passwordInput = document.getElementById("password-input");
    const authBtn = document.getElementById("auth-btn");
    const authResult = document.getElementById("auth-result");
    const conversation = document.getElementById("conversation");
    const promptInput = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");
    const thinkingToggle = document.getElementById("thinking-toggle");
    const appStatus = document.getElementById("app-status");
    const composer = document.getElementById("composer");

    function getToken() {
      return sessionStorage.getItem(TOKEN_KEY);
    }

    function saveToken(token) {
      sessionStorage.setItem(TOKEN_KEY, token);
    }

    function clearToken() {
      sessionStorage.removeItem(TOKEN_KEY);
    }

    function cancelReconnect() {
      if (state.reconnectTimer !== null) {
        window.clearTimeout(state.reconnectTimer);
        state.reconnectTimer = null;
      }
    }

    function socketIsActive(ws) {
      if (!ws) return false;
      return (
        ws.readyState === WebSocket.CONNECTING ||
        ws.readyState === WebSocket.OPEN ||
        ws.readyState === WebSocket.CLOSING
      );
    }

    function resetReconnectBudget() {
      state.reconnectAttempts = 0;
      state.reconnectMs = RECONNECT_BASE_MS;
    }

    function scheduleReconnect() {
      if (state.intentionalClose) return;
      if (state.reconnectTimer !== null) return;
      if (!getToken()) return;
      if (socketIsActive(state.ws)) return;

      if (state.reconnectAttempts >= RECONNECT_MAX_ATTEMPTS) {
        console.warn(
          "[ws] reconnect aborted: retry limit reached (" + RECONNECT_MAX_ATTEMPTS + " attempts)"
        );
        showAuth();
        setConnState("disconnected");
        setStatus("Connection lost after " + RECONNECT_MAX_ATTEMPTS + " reconnect attempts. Please sign in again.", true);
        return;
      }

      const delay = state.reconnectMs;
      state.reconnectMs = Math.min(state.reconnectMs * 2, RECONNECT_MAX_MS);
      state.reconnectAttempts += 1;
      console.info(
        "[ws] reconnect attempt " + state.reconnectAttempts + "/" + RECONNECT_MAX_ATTEMPTS +
        " scheduled in " + delay + " ms"
      );
      state.reconnectTimer = window.setTimeout(function () {
        state.reconnectTimer = null;
        connectWithToken();
      }, delay);
    }

    function setStatus(message, isError) {
      appStatus.textContent = message || "";
      appStatus.classList.toggle("error", Boolean(isError));
    }

    function setConnState(next) {
      state.connState = next;
      state.connected = next === "connected";
      document.body.classList.toggle("is-connected", state.connected);
      const labels = {
        disconnected: "Disconnected",
        connecting: "Connecting",
        authenticating: "Authenticating",
        connected: "Connected",
      };
      connLabel.textContent = labels[next] || "Disconnected";
      if (next === "connected" && state.busy) {
        led.className = "led busy";
      } else if (next === "connected") {
        led.className = "led on";
      } else if (next === "connecting" || next === "authenticating") {
        led.className = "led busy";
      } else {
        led.className = "led off";
      }
      updateControls();
    }

    function setBusy(busy) {
      state.busy = busy;
      document.body.classList.toggle("is-busy", busy);
      if (state.connected) {
        led.className = busy ? "led busy" : "led on";
      }
      updateControls();
    }

    function updateControls() {
      const canAuth = !state.authenticated && !state.busy;
      authBtn.disabled = !canAuth;
      emailInput.disabled = !canAuth;
      passwordInput.disabled = !canAuth;
      sendBtn.disabled = !state.authenticated || state.busy || !promptInput.value.trim();
      promptInput.disabled = !state.authenticated || state.busy;
      thinkingToggle.disabled = !state.authenticated;
      disconnectBtn.hidden = !state.authenticated;
    }

    // Single session-termination point. Every path that returns the user to
    // the login screen goes through here, so a login screen always means:
    // no token, no conversation, no prompt, no email, no trace, no session.
    function showAuth() {
      state.authenticated = false;
      state.email = "";
      state.currentTrace = null;
      clearToken();
      emailInput.value = "";
      passwordInput.value = "";
      promptInput.value = "";
      conversation.innerHTML = "";
      authResult.textContent = "";
      authResult.className = "";
      document.body.classList.add("show-auth");
      document.body.classList.remove("show-chat");
      sessionEmail.textContent = "";
      updateControls();
    }

    function showChat(email) {
      state.authenticated = true;
      state.email = email;
      document.body.classList.remove("show-auth");
      document.body.classList.add("show-chat");
      sessionEmail.textContent = email;
      conversation.innerHTML = "";
      state.currentTrace = null;
      updateControls();
      promptInput.focus();
    }

    function appendBubble(role, text) {
      const wrap = document.createElement("div");
      wrap.className = "bubble " + role;
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = role === "user" ? "You" : "Agent";
      const body = document.createElement("div");
      body.textContent = text;
      wrap.appendChild(who);
      wrap.appendChild(body);
      conversation.appendChild(wrap);
      conversation.scrollTop = conversation.scrollHeight;
      return wrap;
    }

    function ensureTrace() {
      if (state.currentTrace) return state.currentTrace;
      const wrap = document.createElement("div");
      wrap.className = "trace";
      const title = document.createElement("div");
      title.className = "trace-title";
      title.textContent = "Agent trace";
      wrap.appendChild(title);
      conversation.appendChild(wrap);
      state.currentTrace = wrap;
      conversation.scrollTop = conversation.scrollHeight;
      return wrap;
    }

    function appendTrace(kind, message) {
      const wrap = ensureTrace();
      const line = document.createElement("div");
      line.className = "trace-line";
      const label = document.createElement("span");
      label.className = "trace-kind";
      label.textContent = kind;
      line.appendChild(label);
      line.appendChild(document.createTextNode(message));
      wrap.appendChild(line);
      conversation.scrollTop = conversation.scrollHeight;
    }

    function send(payload) {
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
        setStatus("Not connected.", true);
        return false;
      }
      state.ws.send(JSON.stringify(payload));
      return true;
    }

    function handleServerMessage(data) {
      switch (data.type) {
        case "auth_success":
          cancelReconnect();
          resetReconnectBudget();
          console.info("[ws] auth_success: reconnect counter and delay reset");
          authResult.textContent = "Authenticated.";
          authResult.className = "ok";
          setBusy(false);
          showChat(data.email || "");
          setConnState("connected");
          setStatus("");
          break;
        case "auth_error":
          setBusy(false);
          setConnState("disconnected");
          showAuth();
          authResult.textContent = data.message || "Authentication failed or expired.";
          authResult.className = "";
          setStatus(data.message || "Authentication failed or expired.", true);
          break;
        case "step":
          appendTrace("STEP", String(data.step));
          break;
        case "thinking":
          appendTrace("THINKING", data.message || "");
          break;
        case "tool": {
          const params = data.params && Object.keys(data.params).length
            ? " " + JSON.stringify(data.params)
            : "";
          appendTrace("TOOL", (data.name || "") + params);
          break;
        }
        case "authz":
          appendTrace("AUTHZ", data.message || "");
          break;
        case "result":
          appendTrace("RESULT", data.message || "");
          break;
        case "validate":
          appendTrace("VALIDATE", data.message || "");
          break;
        case "final":
          appendBubble("agent", data.content || "");
          state.currentTrace = null;
          setBusy(false);
          setStatus("");
          break;
        case "disconnected":
          setStatus(data.message || "Session closed.");
          break;
        case "error":
          setStatus(data.message || "An unexpected error occurred.", true);
          setBusy(false);
          if (!state.authenticated) {
            authResult.textContent = data.message || "";
            authResult.className = "";
          }
          break;
        default:
          break;
      }
    }

    function connectWithToken() {
      const token = getToken();
      if (!token) {
        cancelReconnect();
        setConnState("disconnected");
        return;
      }
      if (socketIsActive(state.ws)) {
        cancelReconnect();
        return;
      }

      cancelReconnect();
      const proto = location.protocol === "https:" ? "wss" : "ws";
      setConnState("connecting");
      console.info(
        "[ws] connect attempt " +
        (state.reconnectAttempts === 0 ? "initial" : state.reconnectAttempts + "/" + RECONNECT_MAX_ATTEMPTS)
      );
      const ws = new WebSocket(proto + "://" + location.host + "/ws");
      state.ws = ws;

      ws.onopen = function () {
        if (state.ws !== ws) return;
        console.info("[ws] connection open");
        setConnState("authenticating");
        ws.send(JSON.stringify({ type: "auth", token: token }));
      };

      ws.onmessage = function (event) {
        if (state.ws !== ws) return;
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (err) {
          setStatus("Received an unreadable server message.", true);
          return;
        }
        handleServerMessage(data);
      };

      ws.onclose = function (event) {
        if (state.ws !== ws) return;
        state.ws = null;
        setBusy(false);
        console.info(
          "[ws] closed: code=" + event.code + " reason=" + (event.reason || "(none)")
        );

        const wasIntentional = state.intentionalClose;
        state.intentionalClose = false;
        const code = event.code;

        if (code === 4401) {
          cancelReconnect();
          clearToken();
          showAuth();
          setConnState("disconnected");
          setStatus("Session expired or authentication failed. Please sign in again.", true);
          authResult.textContent = "Session expired or authentication failed. Please sign in again.";
          authResult.className = "";
          return;
        }
        if (code === 4408) {
          cancelReconnect();
          showAuth();
          setConnState("disconnected");
          setStatus("Authentication timeout. Please try again.", true);
          authResult.textContent = "Authentication timeout. Please try again.";
          authResult.className = "";
          return;
        }
        if (code === 1013) {
          cancelReconnect();
          showAuth();
          setConnState("disconnected");
          setStatus("Maximum active sessions reached. Please try again later.", true);
          authResult.textContent = "Maximum active sessions reached. Please try again later.";
          authResult.className = "";
          return;
        }
        if (code === 1000 || wasIntentional) {
          cancelReconnect();
          if (wasIntentional) {
            clearToken();
          }
          showAuth();
          setConnState("disconnected");
          if (wasIntentional) {
            setStatus("Session closed.");
          }
          return;
        }
        if (code === 1011) {
          cancelReconnect();
          showAuth();
          setConnState("disconnected");
          setStatus("An unexpected error occurred. Please try again.", true);
          return;
        }

        setConnState("disconnected");
        if (getToken() && !wasIntentional) {
          setStatus("Connection closed. Reconnecting…", true);
          scheduleReconnect();
        } else {
          showAuth();
          setStatus("Connection closed. Please sign in again.", true);
        }
      };

      ws.onerror = function () {
        if (state.ws !== ws) return;
        // Log only. Reconnect is scheduled exclusively in onclose, so a
        // failed connection never produces two reconnect attempts even
        // though the browser fires both onerror and onclose.
        console.warn("[ws] socket error");
        setStatus("WebSocket error.", true);
      };
    }

    async function authenticate() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        authResult.textContent = "Enter your organizational email and password.";
        authResult.className = "";
        return;
      }
      authResult.textContent = "";
      setBusy(true);
      setStatus("");
      cancelReconnect();
      try {
        const response = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password }),
        });
        let data = {};
        try {
          data = await response.json();
        } catch (err) {
          data = {};
        }
        if (response.status === 401) {
          clearToken();
          authResult.textContent = "Authentication failed";
          authResult.className = "";
          setBusy(false);
          return;
        }
        if (!response.ok) {
          const detail = data.detail || "Unable to sign in.";
          authResult.textContent = typeof detail === "string" ? detail : "Unable to sign in.";
          authResult.className = "";
          setBusy(false);
          return;
        }
        if (!data.access_token) {
          authResult.textContent = "Authentication failed";
          authResult.className = "";
          setBusy(false);
          return;
        }
        saveToken(data.access_token);
        resetReconnectBudget();
        connectWithToken();
      } catch (err) {
        authResult.textContent = "Unable to sign in.";
        authResult.className = "";
        setBusy(false);
      }
    }

    authBtn.addEventListener("click", function () {
      authenticate();
    });

    emailInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        authBtn.click();
      }
    });

    passwordInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        authBtn.click();
      }
    });

    composer.addEventListener("submit", function (event) {
      event.preventDefault();
      const content = promptInput.value.trim();
      if (!content || state.busy) return;
      const messageId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
      appendBubble("user", content);
      state.currentTrace = null;
      promptInput.value = "";
      setBusy(true);
      setStatus("Working…");
      send({ type: "user_message", message_id: messageId, content: content });
      updateControls();
    });

    promptInput.addEventListener("input", updateControls);

    promptInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    thinkingToggle.addEventListener("change", function () {
      state.showThinking = thinkingToggle.checked;
      document.body.classList.toggle("thinking-on", state.showThinking);
      if (state.authenticated) {
        send({ type: "thinking", enabled: state.showThinking });
      }
    });

    disconnectBtn.addEventListener("click", function () {
      cancelReconnect();
      resetReconnectBudget();
      state.intentionalClose = true;
      clearToken();
      const ws = state.ws;
      if (ws && ws.readyState === WebSocket.OPEN) {
        send({ type: "disconnect" });
      } else if (ws) {
        try {
          ws.close(1000);
        } catch (err) {
          /* ignore */
        }
      }
      showAuth();
      setConnState("disconnected");
      setStatus("Session closed.");
    });

    showAuth();
    setConnState("disconnected");
    updateControls();
  </script>
</body>
</html>
